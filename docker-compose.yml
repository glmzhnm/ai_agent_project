services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
    ports:
      # Хостовый 5432 занят системным Postgres — наружу пробрасываем на 55432.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  pgdata:
